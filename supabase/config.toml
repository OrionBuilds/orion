# deliverable-publish: get_public is anon-with-token (client viewing a report, no JWT), so the
# gateway must let unauthenticated requests through; create_and_send authorizes internally via
# extractUserContext / isServiceRoleRequest.
[functions.deliverable-publish]
verify_jwt = false

# contract-scope-extract (Autonomy Spec v0.1, item #5/#7): fired fire-and-forget from the public
# contract-signing page (src/services/contractSigning.ts) right after a signature finalizes —
# that page has no logged-in Supabase auth session, only the RPC's own token-hash auth, so there
# is no JWT to gate on. Self-authorizes narrowly: only acts on a contractId, is idempotent
# (no-ops if already extracted), and uses the service-role client internally for the actual write.
[functions.contract-scope-extract]
verify_jwt = false

