# Supabase CLI project config.
#
# Added 2026-07-29 to close QA finding F-11: without this file the CLI does not
# recognise the repo as a Supabase project, so `migration list --linked` and
# `db push` both fail with "Cannot find project ref" even when linked.
#
# The verify_jwt entries below are NOT decoration. The CLI defaults verify_jwt to
# true, so once this file exists any function not listed here would be flipped to
# JWT-required on its next deploy. 135 of the 195 deployed functions currently run
# with verify_jwt=false - webhook receivers, OAuth callbacks and cron targets that
# authenticate by their own means (provider signature, state token, CRON_SECRET).
# Flipping them would break every one at once, so the live state is pinned here.
#
# Generated from the deployed state of the production project. Keep in sync
# when adding a function: declare verify_jwt = false explicitly, or it defaults to true.

