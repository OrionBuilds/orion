<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0D0E10" />
    <title>Orion OS: offline</title>
    <style>
      html, body { height: 100%; margin: 0; background: #0d0e10; color: #f2f2f2; font-family: Inter, system-ui, sans-serif; }
      main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; }
      img { width: 72px; height: 72px; }
      p { margin: 0; color: #a8a8b0; max-width: 28rem; line-height: 1.5; }
      button { margin-top: 8px; padding: 12px 20px; border: 0; border-radius: 10px; background: #dc2626; color: #fff; font-size: 16px; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1 style="margin:0;font-size:1.25rem">You're offline</h1>
      <p>Orion OS needs a connection to load your data. Check your signal or Wi-Fi, then try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
